<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#C49A45"/>
      <stop offset="100%" stop-color="#9A7B31"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2537"/>
      <stop offset="100%" stop-color="#0B1E2D"/>
    </linearGradient>
    <filter id="subtleDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Monogram Circle Badge -->
  <g transform="translate(10, 5)">
    <!-- Outer Gold Ring -->
    <circle cx="50" cy="50" r="48" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="3" filter="url(#subtleDrop)"/>
    <!-- Inner Thin Ring -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
    <!-- LP Monogram Text -->
    <text x="50" y="60" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">LP</text>
  </g>

  <!-- Text Group -->
  <g transform="translate(125, 0)">
    <!-- Name Header -->
    <text x="0" y="32" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="18" font-weight="700" fill="#0B1E2D" letter-spacing="4">LUDO POELAERT</text>
    
    <!-- Subtitle -->
    <text x="0" y="58" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="22" font-weight="600" fill="url(#goldGrad)" letter-spacing="1">Coaching Academy</text>
    
    <!-- Domain Tagline Pill / Subtitle -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#0B1E2D"/>
      <text x="110" y="16" font-family="'Plus Jakarta Sans', 'Inter', 'Helvetica', sans-serif" font-size="12" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="1.5">ludopoelaert.coach</text>
    </g>
  </g>
</svg>
