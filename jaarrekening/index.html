<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jaarrekening voor artsen</title>
  <link rel="stylesheet" href="style.css?v=20261029">
</head>
<body>
  <section id="login" aria-labelledby="login-title">
    <form id="login-form" autocomplete="on">
      <h1 id="login-title">Jaarrekening lezen voor artsen</h1>
      <p style="color: var(--muted); font-size: 0.95rem; margin-bottom: 0.5rem;">Door <strong>Prof. Em. ir. Ludo Poelaert</strong></p>
      <p>Leer aan de hand van reële praktijkcases een balans, een resultatenrekening én de resultaatverwerking lezen.</p>

      <label for="name">Uw naam</label>
      <input id="name" name="name" type="text" autocomplete="name" spellcheck="false" required>

      <label for="code">Toegangscode</label>
      <div class="pw">
        <input id="code" name="code" type="password" autocomplete="off" spellcheck="false" required>
        <button type="button" id="toggle-code" aria-pressed="false">Toon</button>
      </div>

      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">Aanmelden</button>
    </form>
  </section>

  <div id="app" hidden>
    <header>
      <strong>Jaarrekening voor artsen</strong>
      <span style="font-size: 0.85rem; opacity: 0.9; margin-left: 0.5rem; display: inline-block;">| Prof. Em. ir. Ludo Poelaert</span>
      <span id="hello"></span>
      <button id="logout" type="button">Afmelden</button>
    </header>
    <div class="layout">
      <nav aria-label="Lessen">
        <div class="track-picker" style="margin-bottom: 1.2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line);">
          <label for="track-select" style="margin: 0 0 0.4rem; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); display: block;">Kies leertraject:</label>
          <select id="track-select" style="width: 100%; padding: 0.55rem; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; font-size: 0.88rem; background: #fff; color: var(--ink);">
            <option value="basis">1. Basis: Huisartsenpraktijk Janssens</option>
            <option value="realtandarts">2. Masterclass: Real Tandarts BV (NBB)</option>
          </select>
        </div>
        <div class="progress" aria-live="polite">
          <div id="bar"><div id="bar-fill"></div></div>
          <small id="bar-text"></small>
        </div>
        <ol id="lesson-list"></ol>
      </nav>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>

  <script src="app.js?v=20261029"></script>
</body>
</html>
